services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: enterprise-kb-server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_URL: http://localhost:8080
      COOKIE_SECURE: "false"
      COOKIE_SAME_SITE: lax
    volumes:
      - document_uploads:/app/uploads
    networks:
      - enterprise-kb-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: enterprise-kb-client
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "8080:80"
    networks:
      - enterprise-kb-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  enterprise-kb-network:
    driver: bridge

volumes:
  document_uploads:
